<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams風 チーム報告＆フォーラムアプリ</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col font-sans overflow-hidden">

    <!-- ヘッダー -->
    <header class="bg-slate-800 text-white px-4 md:px-6 py-3 flex justify-between items-center shadow-md z-40">
        <div class="flex items-center gap-3">
            <!-- スマホ用メニュー開閉ボタン -->
            <button onclick="toggleSidebar()" class="md:hidden text-slate-300 hover:text-white p-1.5 focus:outline-none">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <i class="fa-solid fa-people-group text-indigo-400 text-xl md:text-2xl"></i>
            <h1 class="font-bold text-base md:text-lg tracking-wide">Team Hub</h1>
        </div>
        <div id="auth-container" class="flex items-center gap-3">
            <span id="user-info" class="text-xs md:text-sm text-slate-300 hidden"></span>
            <button id="login-btn" onclick="loginWithGoogle()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-md font-medium text-xs md:text-sm transition shadow">
                <i class="fa-brands fa-google mr-1.5"></i>ログイン
            </button>
            <button id="logout-btn" onclick="logout()" class="text-slate-400 hover:text-white text-xs transition hidden">
                ログアウト
            </button>
        </div>
    </header>

    <!-- 未ログイン時 -->
    <div id="unauth-view" class="flex-1 flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-gray-200">
            <i class="fa-solid fa-lock text-5xl text-indigo-500 mb-4"></i>
            <h2 class="text-2xl font-bold mb-2">ログインが必要です</h2>
            <p class="text-gray-500 text-sm mb-6">チームに参加・フォーラムを利用するには、Googleアカウントでログインしてください。</p>
            <button onclick="loginWithGoogle()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition shadow-lg flex items-center justify-center gap-2">
                <i class="fa-brands fa-google"></i> Googleでログインして始める
            </button>
        </div>
    </div>

    <!-- ログイン後メイン画面 -->
    <div id="app-view" class="flex-1 flex relative overflow-hidden hidden">
        
        <!-- モバイル用背景オーバーレイ（初期状態は完全に非表示・pointer-events-noneでクリックブロックを防止） -->
        <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-20 hidden pointer-events-none md:hidden"></div>

        <!-- 左サイドバー：グループ一覧 -->
        <aside id="sidebar" class="absolute md:relative inset-y-0 left-0 w-72 bg-slate-900 text-slate-300 flex flex-col border-r border-slate-800 z-30 transform -translate-x-full md:translate-x-0 transition-transform duration-200 ease-in-out">
            <div class="p-4 border-b border-slate-800 space-y-2">
                <button onclick="openJoinModal()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 py-2 px-3 rounded-lg text-sm font-medium transition flex items-center justify-center gap-2 border border-slate-700">
                    <i class="fa-solid fa-key text-indigo-400"></i> コードでグループ参加
                </button>
                <button id="create-group-btn" onclick="openCreateModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2 px-3 rounded-lg text-sm font-medium transition flex items-center justify-center gap-2 shadow hidden">
                    <i class="fa-solid fa-plus"></i> グループ作成 (管理者)
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-3 space-y-1" id="group-list">
                <p class="text-xs text-slate-500 p-2">参加中のグループ</p>
            </div>
            
            <div class="p-3 border-t border-slate-800 bg-slate-950/50 flex justify-between items-center text-xs">
                <span class="text-slate-400">管理者モード:</span>
                <button id="admin-toggle-btn" onclick="promptAdminPassword()" class="px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 font-mono">
                    OFF
                </button>
            </div>
        </aside>

        <!-- メインエリア -->
        <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden w-full">
            
            <div id="no-group-selected" class="flex-1 flex flex-col items-center justify-center text-gray-400 p-6 text-center">
                <i class="fa-regular fa-comments text-5xl md:text-6xl mb-3 text-gray-300"></i>
                <p class="text-sm">左側のリストからグループを選択してください</p>
            </div>

            <!-- グループ選択時 -->
            <div id="group-active-content" class="flex-1 flex flex-col h-full hidden">
                <div class="bg-white px-4 md:px-6 py-2.5 border-b border-gray-200 flex flex-wrap justify-between items-center gap-2 shadow-sm">
                    <div class="overflow-hidden">
                        <h2 id="current-group-title" class="text-sm md:text-base font-bold text-gray-800 truncate">グループ名</h2>
                        <p id="current-group-desc" class="text-[11px] md:text-xs text-gray-500 truncate">説明文</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <span id="current-group-code" class="bg-slate-100 text-slate-600 font-mono text-[11px] md:text-xs px-2 py-1 rounded border border-slate-200">
                            コード: ------
                        </span>
                        <button id="manage-members-btn" onclick="openMembersModal()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300 text-xs px-2.5 py-1 rounded-lg font-bold transition hidden items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-users-gear"></i> メンバー
                        </button>
                        <button id="delete-group-btn" onclick="handleDeleteGroup()" class="bg-red-50 hover:bg-red-100 text-red-600 border border-red-200 text-xs px-2.5 py-1 rounded-lg font-bold transition hidden items-center gap-1 shadow-sm">
                            <i class="fa-solid fa-trash-can"></i> 削除
                        </button>
                    </div>
                </div>

                <!-- 内部レイアウト -->
                <div class="flex-1 flex overflow-hidden relative">
                    
                    <!-- トピック一覧 -->
                    <div id="topic-container" class="w-full md:w-80 bg-white border-r border-gray-200 flex flex-col h-full absolute md:relative inset-0 z-10">
                        <div class="p-2.5 md:p-3 border-b border-gray-200 flex justify-between items-center bg-gray-50">
                            <span class="text-xs font-bold text-gray-600 uppercase tracking-wider"><i class="fa-solid fa-list-ul mr-1"></i> フォーラム一覧</span>
                            <button onclick="openTopicModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs px-2.5 py-1.5 rounded-lg font-bold transition flex items-center gap-1 shadow-sm">
                                <i class="fa-solid fa-pen-to-square"></i> 新規トピック
                            </button>
                        </div>
                        <div id="topic-list" class="flex-1 overflow-y-auto divide-y divide-gray-100">
                            <!-- トピックがここに並びます -->
                        </div>
                    </div>

                    <!-- 選択されたトピックのチャット詳細 -->
                    <div id="chat-container" class="flex-1 flex flex-col bg-slate-50 h-full absolute md:relative inset-0 z-20 hidden md:flex">
                        <div id="no-topic-selected" class="flex-1 flex flex-col items-center justify-center text-gray-400 p-6 text-center">
                            <i class="fa-regular fa-folder-open text-4xl md:text-5xl mb-2 text-gray-300"></i>
                            <p class="text-xs">トピックを選択してください</p>
                        </div>

                        <div id="topic-active-content" class="flex-1 flex flex-col h-full hidden">
                            <div class="bg-white px-3 md:px-4 py-2 border-b border-gray-200 shadow-sm flex items-center justify-between">
                                <div class="flex items-center gap-2 overflow-hidden">
                                    <button onclick="backToTopicList()" class="md:hidden text-indigo-600 hover:text-indigo-800 text-xs font-bold px-2.5 py-1.5 bg-indigo-50 rounded-lg border border-indigo-200 flex items-center gap-1">
                                        <i class="fa-solid fa-arrow-left"></i> 一覧へ
                                    </button>
                                    <div class="overflow-hidden">
                                        <h3 id="current-topic-title" class="text-xs md:text-sm font-bold text-gray-800 truncate">トピック名</h3>
                                        <span id="current-topic-author" class="text-[10px] text-gray-400">作成者: </span>
                                    </div>
                                </div>
                            </div>

                            <div id="message-timeline" class="flex-1 overflow-y-auto p-3 md:p-4 space-y-3"></div>

                            <div class="p-2 md:p-3 bg-white border-t border-gray-200">
                                <form onsubmit="handlePostMessage(event)" class="flex gap-2">
                                    <input type="text" id="post-input" placeholder="返信を入力..." required class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 md:px-4 py-2 rounded-lg text-xs font-bold transition shadow flex items-center gap-1">
                                        <i class="fa-solid fa-paper-plane"></i> <span class="hidden sm:inline">送信</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- モーダル各種 -->
    <div id="members-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl flex flex-col max-h-[80vh]">
            <h3 class="text-lg font-bold mb-1">メンバー管理（キック）</h3>
            <p class="text-xs text-gray-500 mb-4">グループに参加しているメンバーの一覧です</p>
            <div id="members-list" class="flex-1 overflow-y-auto divide-y divide-gray-100 mb-4 pr-1"></div>
            <div class="flex justify-end pt-2 border-t border-gray-100">
                <button type="button" onclick="closeMembersModal()" class="px-4 py-2 text-sm bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-lg font-bold">閉じる</button>
            </div>
        </div>
    </div>

    <div id="join-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl">
            <h3 class="text-lg font-bold mb-1">グループに入室</h3>
            <p class="text-xs text-gray-500 mb-4">共有された入室コードを入力してください</p>
            <form onsubmit="handleJoinGroup(event)">
                <input type="text" id="join-code-input" placeholder="例: ABC123" required class="w-full border border-gray-300 rounded-lg p-2.5 font-mono text-center text-lg tracking-widest uppercase mb-4 focus:ring-2 focus:ring-indigo-500 outline-none">
                <div class="flex justify-end gap-2">
                    <button type="button" onclick="closeJoinModal()" class="px-4 py-2 text-sm text-gray-500 hover:bg-gray-100 rounded-lg">キャンセル</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold">参加する</button>
                </div>
            </form>
        </div>
    </div>

    <div id="create-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <h3 class="text-lg font-bold mb-1">新規グループ名作成</h3>
            <form onsubmit="handleCreateGroup(event)" class="space-y-4 mt-3">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">グループ名</label>
                    <input type="text" id="create-title-input" placeholder="例: 開発プロジェクト" required class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">説明 (任意)</label>
                    <input type="text" id="create-desc-input" placeholder="例: 進捗共有用" class="w-full border rounded-lg p-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">入室コード（半角英数）</label>
                    <input type="text" id="create-code-input" placeholder="例: TEAM2026" required class="w-full border rounded-lg p-2 font-mono text-sm uppercase outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeCreateModal()" class="px-4 py-2 text-sm text-gray-500 hover:bg-gray-100 rounded-lg">キャンセル</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold">作成</button>
                </div>
            </form>
        </div>
    </div>

    <div id="topic-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
            <h3 class="text-lg font-bold mb-1">新規トピック作成</h3>
            <p class="text-xs text-gray-500 mb-4">新しい議論の部屋を作ります</p>
            <form onsubmit="handleCreateTopic(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">トピック名</label>
                    <input type="text" id="topic-title-input" placeholder="例: 今後のスケジュールについて" required class="w-full border rounded-lg p-2.5 text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeTopicModal()" class="px-4 py-2 text-sm text-gray-500 hover:bg-gray-100 rounded-lg">キャンセル</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold">作成する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDK & アプリのプログラム -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, setDoc, getDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDNYfcTAGa7kiLsi9akQ4OxG3HAjoaiTJ8",
            authDomain: "music-51427.firebaseapp.com",
            projectId: "music-51427",
            storageBucket: "music-51427.firebasestorage.app",
            messagingSenderId: "771180148192",
            appId: "1:771180148192:web:774b50e2cb9728d7972785",
            measurementId: "G-0ZMERMXW3B"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let isAdmin = false;
        let myGroups = [];
        let currentGroupId = null;
        let currentTopicId = null;
        let unsubscribeTopics = null;
        let unsubscribeMessages = null;

        const ADMIN_PASSWORD = "Tomoya@0317";

        // サイドバーの開閉制御（pointer-eventsも切り替えてクリック阻害を防ぐ）
        window.toggleSidebar = () => {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.toggle('-translate-x-full');
            if (overlay.classList.contains('hidden')) {
                overlay.classList.remove('hidden', 'pointer-events-none');
            } else {
                overlay.classList.add('hidden', 'pointer-events-none');
            }
        };

        window.backToTopicList = () => {
            currentTopicId = null;
            if (window.innerWidth < 768) {
                document.getElementById('chat-container').classList.add('hidden');
                document.getElementById('topic-container').classList.remove('hidden');
            }
            document.getElementById('no-topic-selected').classList.remove('hidden');
            document.getElementById('topic-active-content').classList.add('hidden');
        };

        window.loginWithGoogle = async () => {
            try { await signInWithPopup(auth, provider); }
            catch (e) { alert("ログインエラー: " + e.message); }
        };
        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, async (user) => {
            currentUser = user;
            const unauthView = document.getElementById('unauth-view');
            const appView = document.getElementById('app-view');
            const userInfo = document.getElementById('user-info');
            const loginBtn = document.getElementById('login-btn');
            const logoutBtn = document.getElementById('logout-btn');

            if (user) {
                unauthView.classList.add('hidden');
                appView.classList.remove('hidden');
                userInfo.textContent = `${user.displayName} さん`;
                userInfo.classList.remove('hidden');
                loginBtn.classList.add('hidden');
                logoutBtn.classList.remove('hidden');

                await setDoc(doc(db, "users", user.uid), {
                    name: user.displayName,
                    email: user.email,
                    photoURL: user.photoURL
                }, { merge: true });

                loadUserGroups();
            } else {
                unauthView.classList.remove('hidden');
                appView.classList.add('hidden');
                userInfo.classList.add('hidden');
                loginBtn.classList.remove('hidden');
                logoutBtn.classList.add('hidden');
            }
        });

        window.promptAdminPassword = () => {
            if (isAdmin) {
                isAdmin = false;
                updateAdminUI();
                return;
            }

            const inputPass = prompt("管理者パスワードを入力してください：");
            if (inputPass === null) return;

            if (inputPass === ADMIN_PASSWORD) {
                isAdmin = true;
                updateAdminUI();
                alert("管理者モードが有効になりました。");
            } else {
                alert("パスワードが違います。");
            }
        };

        function updateAdminUI() {
            const btn = document.getElementById('admin-toggle-btn');
            const createBtn = document.getElementById('create-group-btn');
            const deleteGroupBtn = document.getElementById('delete-group-btn');
            const manageMembersBtn = document.getElementById('manage-members-btn');

            if (isAdmin) {
                btn.textContent = "ON";
                btn.className = "px-2.5 py-1 rounded bg-indigo-600 text-white font-bold font-mono";
                createBtn.classList.remove('hidden');
                if (currentGroupId) {
                    deleteGroupBtn.classList.remove('hidden');
                    manageMembersBtn.classList.remove('hidden');
                }
            } else {
                btn.textContent = "OFF";
                btn.className = "px-2.5 py-1 rounded bg-slate-800 text-slate-300 hover:bg-slate-700 font-mono";
                createBtn.classList.add('hidden');
                deleteGroupBtn.classList.add('hidden');
                manageMembersBtn.classList.add('hidden');
            }
        }

        async function loadUserGroups() {
            if (!currentUser) return;
            const q = query(collection(db, "memberships"), where("uid", "==", currentUser.uid));
            const snapshot = await getDocs(q);
            const groupIds = snapshot.docs.map(doc => doc.data().groupId);

            myGroups = [];
            for (let id of groupIds) {
                const gDoc = await getDoc(doc(db, "groups", id));
                if (gDoc.exists()) {
                    myGroups.push({ id: gDoc.id, ...gDoc.data() });
                }
            }
            renderGroupList();
        }

        function renderGroupList() {
            const listEl = document.getElementById('group-list');
            listEl.innerHTML = `<p class="text-xs text-slate-500 p-2">参加中のグループ (${myGroups.length})</p>`;
            
            myGroups.forEach(g => {
                const activeClass = g.id === currentGroupId ? "bg-indigo-600 text-white" : "hover:bg-slate-800 text-slate-300";
                const item = document.createElement('div');
                item.className = `p-3 rounded-xl cursor-pointer transition flex items-center gap-3 ${activeClass}`;
                item.onclick = () => {
                    selectGroup(g.id);
                    if (window.innerWidth < 768) {
                        // スマホでグループを選んだらサイドバーを閉じる
                        document.getElementById('sidebar').classList.add('-translate-x-full');
                        document.getElementById('sidebar-overlay').classList.add('hidden', 'pointer-events-none');
                    }
                };
                item.innerHTML = `
                    <i class="fa-solid fa-hashtag text-slate-400"></i>
                    <div class="overflow-hidden">
                        <div class="font-semibold text-sm truncate">${escapeHTML(g.title)}</div>
                        <div class="text-xs opacity-70 truncate">${escapeHTML(g.desc || '')}</div>
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        function selectGroup(groupId) {
            currentGroupId = groupId;
            currentTopicId = null;
            const group = myGroups.find(g => g.id === groupId);
            if (!group) return;

            document.getElementById('no-group-selected').classList.add('hidden');
            document.getElementById('group-active-content').classList.remove('hidden');
            
            document.getElementById('topic-container').classList.remove('hidden');
            document.getElementById('chat-container').classList.add('hidden', 'md:flex');

            document.getElementById('no-topic-selected').classList.remove('hidden');
            document.getElementById('topic-active-content').classList.add('hidden');
            
            document.getElementById('current-group-title').textContent = group.title;
            document.getElementById('current-group-desc').textContent = group.desc || '説明なし';
            document.getElementById('current-group-code').textContent = `コード: ${group.code}`;

            const deleteGroupBtn = document.getElementById('delete-group-btn');
            const manageMembersBtn = document.getElementById('manage-members-btn');
            if (isAdmin) {
                deleteGroupBtn.classList.remove('hidden');
                manageMembersBtn.classList.remove('hidden');
            } else {
                deleteGroupBtn.classList.add('hidden');
                manageMembersBtn.classList.add('hidden');
            }

            renderGroupList();
            listenTopics(groupId);
        }

        function listenTopics(groupId) {
            if (unsubscribeTopics) unsubscribeTopics();

            const q = query(collection(db, `groups/${groupId}/topics`), orderBy("createdAt", "desc"));
            unsubscribeTopics = onSnapshot(q, (snapshot) => {
                const topicList = document.getElementById('topic-list');
                topicList.innerHTML = '';

                if (snapshot.empty) {
                    topicList.innerHTML = `<p class="text-xs text-gray-400 p-4 text-center">トピックがありません。<br>「新規トピック」から話題を追加してください。</p>`;
                    return;
                }

                snapshot.forEach(docSnap => {
                    const topicId = docSnap.id;
                    const data = docSnap.data();
                    const isActive = topicId === currentTopicId;
                    const canDelete = isAdmin || (currentUser && data.createdBy === currentUser.uid);

                    const item = document.createElement('div');
                    item.className = `p-3 transition hover:bg-indigo-50 flex justify-between items-center ${isActive ? 'bg-indigo-50 border-l-4 border-indigo-600' : ''}`;
                    
                    const infoDiv = document.createElement('div');
                    infoDiv.className = "flex-1 cursor-pointer overflow-hidden pr-2";
                    infoDiv.onclick = () => selectTopic(topicId, data.title, data.createdByUserName);
                    infoDiv.innerHTML = `
                        <div class="font-bold text-xs text-gray-800 truncate mb-1"><i class="fa-regular fa-comments text-indigo-500 mr-1"></i> ${escapeHTML(data.title)}</div>
                        <div class="text-[10px] text-gray-400">作成者: ${escapeHTML(data.createdByUserName || 'メンバー')}</div>
                    `;
                    item.appendChild(infoDiv);

                    if (canDelete) {
                        const deleteBtn = document.createElement('button');
                        deleteBtn.className = "text-gray-400 hover:text-red-600 p-1.5 transition text-xs";
                        deleteBtn.title = "トピックを削除";
                        deleteBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
                        deleteBtn.onclick = (e) => {
                            e.stopPropagation();
                            handleDeleteTopic(topicId, data.title);
                        };
                        item.appendChild(deleteBtn);
                    }

                    topicList.appendChild(item);
                });
            });
        }

        function selectTopic(topicId, title, authorName) {
            currentTopicId = topicId;
            document.getElementById('no-topic-selected').classList.add('hidden');
            document.getElementById('topic-active-content').classList.remove('hidden');
            document.getElementById('current-topic-title').textContent = title;
            document.getElementById('current-topic-author').textContent = `作成者: ${authorName || 'メンバー'}`;

            if (window.innerWidth < 768) {
                document.getElementById('topic-container').classList.add('hidden');
                document.getElementById('chat-container').classList.remove('hidden');
            }

            listenMessages(currentGroupId, topicId);
            listenTopics(currentGroupId);
        }

        function listenMessages(groupId, topicId) {
            if (unsubscribeMessages) unsubscribeMessages();

            const q = query(collection(db, `groups/${groupId}/topics/${topicId}/messages`), orderBy("createdAt", "asc"));
            unsubscribeMessages = onSnapshot(q, (snapshot) => {
                const timeline = document.getElementById('message-timeline');
                timeline.innerHTML = '';

                snapshot.forEach(docSnap => {
                    const msg = docSnap.data();
                    const isMe = currentUser && msg.uid === currentUser.uid;
                    const timeStr = msg.createdAt ? msg.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '送信中...';

                    const msgEl = document.createElement('div');
                    msgEl.className = `flex gap-3 ${isMe ? 'flex-row-reverse' : ''}`;
                    msgEl.innerHTML = `
                        <img src="${msg.photoURL || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full object-cover shadow-sm flex-shrink-0">
                        <div class="max-w-[75%] md:max-w-md">
                            <div class="text-[10px] text-gray-500 mb-0.5 ${isMe ? 'text-right' : ''}">${escapeHTML(msg.userName)} <span class="text-gray-400 ml-1">${timeStr}</span></div>
                            <div class="p-2.5 rounded-xl text-xs ${isMe ? 'bg-indigo-600 text-white rounded-tr-none' : 'bg-white text-gray-800 rounded-tl-none shadow-sm border border-gray-100'} break-words">
                                ${escapeHTML(msg.text)}
                            </div>
                        </div>
                    `;
                    timeline.appendChild(msgEl);
                });
                timeline.scrollTop = timeline.scrollHeight;
            });
        }

        window.handlePostMessage = async (e) => {
            e.preventDefault();
            if (!currentGroupId || !currentTopicId || !currentUser) return;
            const input = document.getElementById('post-input');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            await addDoc(collection(db, `groups/${currentGroupId}/topics/${currentTopicId}/messages`), {
                uid: currentUser.uid,
                userName: currentUser.displayName,
                photoURL: currentUser.photoURL,
                text: text,
                createdAt: serverTimestamp()
            });
        };

        async function handleDeleteTopic(topicId, topicTitle) {
            if (!confirm(`トピック「${topicTitle}」を削除しますか？`)) return;
            try {
                await deleteDoc(doc(db, `groups/${currentGroupId}/topics`, topicId));
                if (currentTopicId === topicId) {
                    currentTopicId = null;
                    if (window.innerWidth < 768) {
                        document.getElementById('chat-container').classList.add('hidden');
                        document.getElementById('topic-container').classList.remove('hidden');
                    }
                    document.getElementById('no-topic-selected').classList.remove('hidden');
                    document.getElementById('topic-active-content').classList.add('hidden');
                }
            } catch (e) {
                alert("削除エラー: " + e.message);
            }
        }

        window.handleDeleteGroup = async () => {
            if (!isAdmin) return alert("管理者権限が必要です");
            const group = myGroups.find(g => g.id === currentGroupId);
            if (!group) return;

            if (!confirm(`本当にグループ「${group.title}」を削除しますか？\n（この操作は取り消せません）`)) return;

            try {
                const memQuery = query(collection(db, "memberships"), where("groupId", "==", currentGroupId));
                const memSnapshot = await getDocs(memQuery);
                for (let mDoc of memSnapshot.docs) {
                    await deleteDoc(doc(db, "memberships", mDoc.id));
                }

                await deleteDoc(doc(db, "groups", currentGroupId));

                currentGroupId = null;
                currentTopicId = null;
                document.getElementById('group-active-content').classList.add('hidden');
                document.getElementById('no-group-selected').classList.remove('hidden');
                document.getElementById('delete-group-btn').classList.add('hidden');
                document.getElementById('manage-members-btn').classList.add('hidden');

                await loadUserGroups();
                alert("グループを削除しました。");
            } catch (e) {
                alert("グループ削除エラー: " + e.message);
            }
        };

        window.openMembersModal = async () => {
            if (!currentGroupId || !isAdmin) return;
            const modal = document.getElementById('members-modal');
            const listEl = document.getElementById('members-list');
            listEl.innerHTML = '<p class="text-xs text-gray-400 p-4 text-center">読み込み中...</p>';
            modal.classList.remove('hidden');

            try {
                const memQuery = query(collection(db, "memberships"), where("groupId", "==", currentGroupId));
                const memSnapshot = await getDocs(memQuery);

                listEl.innerHTML = '';
                if (memSnapshot.empty) {
                    listEl.innerHTML = '<p class="text-xs text-gray-400 p-4 text-center">メンバーがいません。</p>';
                    return;
                }

                for (let memDoc of memSnapshot.docs) {
                    const memData = memDoc.data();
                    const membershipId = memDoc.id;

                    const userDoc = await getDoc(doc(db, "users", memData.uid));
                    const userData = userDoc.exists() ? userDoc.data() : { name: "不明なユーザー", email: "" };

                    const item = document.createElement('div');
                    item.className = "py-2.5 flex items-center justify-between";
                    item.innerHTML = `
                        <div class="flex items-center gap-2.5 overflow-hidden">
                            <img src="${userData.photoURL || 'https://via.placeholder.com/40'}" class="w-8 h-8 rounded-full object-cover">
                            <div class="overflow-hidden">
                                <div class="font-bold text-xs text-gray-800 truncate">${escapeHTML(userData.name)}</div>
                                <div class="text-[10px] text-gray-400 truncate">${escapeHTML(userData.email || '')}</div>
                            </div>
                        </div>
                        ${memData.uid === currentUser.uid ? 
                            '<span class="text-[10px] bg-gray-100 text-gray-500 px-2 py-1 rounded">あなた</span>' : 
                            `<button onclick="kickMember('${membershipId}', '${escapeHTML(userData.name)}')" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs px-2.5 py-1 rounded font-bold transition">キック</button>`
                        }
                    `;
                    listEl.appendChild(item);
                }
            } catch (e) {
                listEl.innerHTML = `<p class="text-xs text-red-500 p-4 text-center">エラー: ${e.message}</p>`;
            }
        };

        window.closeMembersModal = () => {
            document.getElementById('members-modal').classList.add('hidden');
        };

        window.kickMember = async (membershipId, memberName) => {
            if (!confirm(`本当に「${memberName}」をこのグループからキックしますか？`)) return;
            try {
                await deleteDoc(doc(db, "memberships", membershipId));
                alert(`${memberName} をキックしました。`);
                openMembersModal();
            } catch (e) {
                alert("キックエラー: " + e.message);
            }
        };

        window.openJoinModal = () => document.getElementById('join-modal').classList.remove('hidden');
        window.closeJoinModal = () => document.getElementById('join-modal').classList.add('hidden');
        window.openCreateModal = () => document.getElementById('create-modal').classList.remove('hidden');
        window.closeCreateModal = () => document.getElementById('create-modal').classList.add('hidden');
        window.openTopicModal = () => document.getElementById('topic-modal').classList.remove('hidden');
        window.closeTopicModal = () => document.getElementById('topic-modal').classList.add('hidden');

        window.handleJoinGroup = async (e) => {
            e.preventDefault();
            const code = document.getElementById('join-code-input').value.trim().toUpperCase();
            if (!code) return;

            const q = query(collection(db, "groups"), where("code", "==", code));
            const snapshot = await getDocs(q);

            if (snapshot.empty) {
                alert("該当するグループが見つかりません。");
                return;
            }

            const groupDoc = snapshot.docs[0];
            const groupId = groupDoc.id;

            const memberCheckQ = query(
                collection(db, "memberships"), 
                where("uid", "==", currentUser.uid),
                where("groupId", "==", groupId)
            );
            const memberCheckSnapshot = await getDocs(memberCheckQ);

            if (!memberCheckSnapshot.empty) {
                alert("すでにこのグループに参加しています！");
                closeJoinModal();
                document.getElementById('join-code-input').value = '';
                return;
            }

            await addDoc(collection(db, "memberships"), {
                uid: currentUser.uid,
                groupId: groupId,
                joinedAt: serverTimestamp()
            });

            closeJoinModal();
            document.getElementById('join-code-input').value = '';
            await loadUserGroups();
            selectGroup(groupId);
        };

        window.handleCreateGroup = async (e) => {
            e.preventDefault();
            if (!isAdmin) return alert("管理者権限が必要です");

            const title = document.getElementById('create-title-input').value.trim();
            const desc = document.getElementById('create-desc-input').value.trim();
            const code = document.getElementById('create-code-input').value.trim().toUpperCase();

            const codeCheckQ = query(collection(db, "groups"), where("code", "==", code));
            const codeCheckSnapshot = await getDocs(codeCheckQ);

            if (!codeCheckSnapshot.empty) {
                alert("この入室コードはすでに使用されています。別のコードを指定してください。");
                return;
            }

            const groupRef = await addDoc(collection(db, "groups"), {
                title, desc, code,
                createdBy: currentUser.uid,
                createdAt: serverTimestamp()
            });

            await addDoc(collection(db, "memberships"), {
                uid: currentUser.uid,
                groupId: groupRef.id,
                joinedAt: serverTimestamp()
            });

            closeCreateModal();
            document.getElementById('create-title-input').value = '';
            document.getElementById('create-desc-input').value = '';
            document.getElementById('create-code-input').value = '';

            await loadUserGroups();
            selectGroup(groupRef.id);
        };

        window.handleCreateTopic = async (e) => {
            e.preventDefault();
            if (!currentGroupId || !currentUser) return;

            const title = document.getElementById('topic-title-input').value.trim();
            if (!title) return;

            const topicRef = await addDoc(collection(db, `groups/${currentGroupId}/topics`), {
                title: title,
                createdBy: currentUser.uid,
                createdByUserName: currentUser.displayName,
                createdAt: serverTimestamp()
            });

            closeTopicModal();
            document.getElementById('topic-title-input').value = '';
            selectTopic(topicRef.id, title, currentUser.displayName);
        };

        function escapeHTML(str) {
            return str ? str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)) : '';
        }
    </script>
</body>
</html>
